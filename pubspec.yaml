name: biolens
description: AI-powered fly identification app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core
  cupertino_icons: ^1.0.5
  provider: ^6.0.5
  
  # UI
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  lottie: ^2.6.0
  flutter_staggered_grid_view: ^0.7.0
  
  # Camera & Images
  camera: ^0.10.5+4
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  photo_view: ^0.14.0
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  location: ^5.0.3
  geolocator: ^10.1.0
  
  # Storage
  shared_preferences: ^2.2.1
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Networking
  http: ^1.1.0
  connectivity_plus: ^5.0.1
  
  # Utils
  url_launcher: ^6.1.14
  intl: ^0.18.1
  permission_handler: ^11.0.0
  package_info_plus: ^4.1.0
  device_info_plus: ^9.0.3
  
  # Animation
  flutter_animate: ^4.2.0
  
  # ML & AI
  tflite_flutter: ^0.10.1
  image: ^4.1.3
  timeago: ^3.7.0
  latlong2: ^0.9.1
  flutter_map: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.2

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#4CAF50"
  image: assets/icon/splash_icon.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/model/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

